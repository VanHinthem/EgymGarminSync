name: CI
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore and build CLI
        run: dotnet build src/EgymGarminSync.Cli/EgymGarminSync.Cli.csproj --configuration Release
      - name: Build Garmin discovery prototype
        run: dotnet build src/EgymGarminSync.Garmin.Cli/EgymGarminSync.Garmin.Cli.csproj --configuration Release
      - name: Build web API
        run: dotnet build src/EgymGarminSync.Web/EgymGarminSync.Web.csproj --configuration Release
      - name: Execute guarded write integration check
        run: dotnet run --project src/EgymGarminSync.Web/EgymGarminSync.Web.csproj --configuration Release -- --test-uncertain-isolation
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build web UI
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Execute read-only matching tests
        run: dotnet test tests/EgymGarminSync.Matching.Tests/EgymGarminSync.Matching.Tests.csproj --configuration Release
      - name: Execute unit tests
        run: dotnet test tests/EgymGarminSync.Egym.Tests/EgymGarminSync.Egym.Tests.csproj --configuration Release
