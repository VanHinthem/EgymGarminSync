name: Publish Docker image
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Optional version tag to publish and create a GitHub release (e.g. v1.0.0)'
        required: false
        type: string

concurrency:
  group: docker-main-publish
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ inputs.release_version }},enable=${{ inputs.release_version != '' }}
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create versioned GitHub release after successful image publication
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_version != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.release_version }}
        run: |
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected release_version like v1.0.0" >&2
            exit 1
          fi
          gh release create "$VERSION" \
            --target "$GITHUB_SHA" \
            --title "EGYM Garmin Sync $VERSION" \
            --generate-notes
